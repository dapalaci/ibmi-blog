<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustración de un puente esquemático que conecta una terminal IBMi con una pila de servicios en la nube">
  <!-- terminal block (IBMi) -->
  <rect x="50" y="70" width="190" height="140" rx="6" fill="#f4f2ec" stroke="#17150f" stroke-width="2.5"/>
  <rect x="70" y="90" width="150" height="90" rx="2" fill="#17150f"/>
  <rect x="86" y="108" width="90" height="5" fill="#b5501c"/>
  <rect x="86" y="124" width="118" height="5" fill="#b5501c" opacity="0.75"/>
  <rect x="86" y="140" width="70" height="5" fill="#b5501c" opacity="0.55"/>
  <rect x="86" y="156" width="100" height="5" fill="#b5501c" opacity="0.4"/>
  <rect x="115" y="210" width="60" height="12" fill="#17150f"/>
  <rect x="95" y="222" width="100" height="8" rx="2" fill="#17150f"/>

  <!-- bridge path with node markers -->
  <path d="M245 140 Q400 55 555 140" fill="none" stroke="#b5501c" stroke-width="3"/>
  <circle cx="300" cy="112" r="6" fill="#b5501c"/>
  <circle cx="400" cy="92" r="6" fill="#b5501c"/>
  <circle cx="500" cy="112" r="6" fill="#b5501c"/>

  <!-- cloud / layered stack block -->
  <rect x="580" y="150" width="170" height="34" rx="6" fill="#f4f2ec" stroke="#2b5f5c" stroke-width="2.5"/>
  <rect x="598" y="108" width="150" height="34" rx="6" fill="#f4f2ec" stroke="#2b5f5c" stroke-width="2.5"/>
  <rect x="616" y="66" width="130" height="34" rx="6" fill="#2b5f5c"/>
</svg>
